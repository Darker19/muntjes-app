name: Demo op GitHub Pages

# De demo op GitHub Pages volgt de branch "preview": daar worden nieuwe ideeën eerst getest.
# De live app (muntjes.darkesttimes.nl) volgt alleen "main" (zie deploy.yml).
on:
  push:
    branches: [ preview ]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Dezelfde app als op muntjes.darkesttimes.nl; op github.io draait hij als demo (zonder server).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
